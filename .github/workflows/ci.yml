name: PhishShield CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Create virtualenv & install deps
        run: |
          uv venv .venv
          uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Lint with ruff
        run: .venv/bin/ruff check backend/ --output-format=github

      - name: Set test env vars
        run: |
          echo "AES_MASTER_KEY=$(python3 -c "import secrets,base64; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")==" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-test-jwt-secret-$(date +%s)" >> $GITHUB_ENV
          echo "ADMIN_EMAIL=admin@test.local" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=TestPassword123!" >> $GITHUB_ENV
          echo "AUTH_DNS_MODE=test" >> $GITHUB_ENV
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

      - name: Train ML model (synthetic data for CI)
        run: |
          mkdir -p backend/ml/data
          .venv/bin/python -m backend.ml.download_data
          .venv/bin/python -m backend.ml.train
        env:
          PYTHONIOENCODING: utf-8

      - name: Run tests with coverage
        run: |
          .venv/bin/pytest backend/tests/ -v \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            -x
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 50 || true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://localhost:8443
