[project]
name = "phishshield"
version = "0.1.0"
description = "PhishShield - Secure Email Gateway"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "aiosmtpd>=1.4.4",
    "dkimpy>=1.1.3",
    "dnspython>=2.6.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "bleach>=6.1.0",
    "tldextract>=5.1.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "eli5>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
